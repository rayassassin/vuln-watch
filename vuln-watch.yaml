# ============================================================
# vuln-watch 配置
# 你日常只需要维护 assets（组件清单）和 cnas（厂商订阅）两块
# ============================================================

# ---------- 1. NVD：按 CNA 订阅厂商全家桶 ----------
# CNA = CVE Numbering Authority。厂商自己就是 CNA 时，
# 用 sourceIdentifier 一个参数就能拿到它所有产品线的 CVE，
# 不用逐个去翻厂商公告页。
# 完整 CNA 名单：https://www.cve.org/PartnerInformation/ListofPartners
nvd:
  api_key_env: NVD_API_KEY      # 可选。有 key 50 req/30s，无 key 5 req/30s
  # 日报只覆盖最近 1 天。水位只用来缩短窗口，不会回补历史，
  # 所以某次失败重跑也不会把几天的存量一次性倒出来。
  lookback_days: 1
  cnas:
    - security@apache.org       # Apache 全家桶：Tomcat / Struts / Kafka / ActiveMQ
                                #   Pulsar / Solr / Airflow / httpd / Shiro / Dubbo
    - security@php.net          # PHP 解释器本体
    - secalert_us@oracle.com    # Oracle 全家桶：JDK / WebLogic / MySQL
    - cna@python.org            # Python / CPython 官方
    - f5sirt@f5.com             # F5 与 NGINX（nginx 的 CVE 大都由 F5 作为 CNA 分配）
  # 关键词通道：给"没有自家 CNA"的产品兜底。
  # 实测（30 天窗口）nginx 31 条、postgresql 42 条、python 136 条、vue 8 条；
  # 而 cna@postgresql.org 返回 0 条——这类产品只能靠 keywordSearch。
  # 代价是噪声比 CNA 高，所以回填靠 min_cvss 挡、日报靠 keyword_watch 挡。
  keywords:
    - nginx
    - postgresql
    - python
    - vue
    - redis
    - kubernetes
    - docker

# GitHub Advisory 按生态全量拉取（不依赖资产清单）。
# 这是 java/python/vue/php 覆盖面最大的来源：NVD 对开源库收录滞后，
# OSV 又必须点名查询，只有这里能"按生态"看新增。
gh_ecosystems:
  - Maven       # Java
  - PyPI        # Python
  - npm         # JS / Vue / React
  - Packagist   # PHP
  - Go
  - NuGet

# ---------- 2. OSV：按组件坐标 + 版本精确匹配 ----------
# 这是"命中你的资产"最准的方式。ecosystem 可选 Maven / Packagist /
# npm / PyPI / Go / crates.io / NuGet。
# 不写 version 时会拉该包全量漏洞再按 lookback 过滤，噪声较大，建议尽量填版本。
osv:
  # 注意：实际窗口由 nvd.lookback_days / --days 决定，这里只留作说明
  lookback_days: 1
  assets:
    # ---- Java / Spring 技术栈 ----
    - { eco: Maven, name: "org.apache.tomcat:tomcat-catalina",          version: "9.0.80", match: [tomcat] }
    - { eco: Maven, name: "org.apache.tomcat.embed:tomcat-embed-core",  version: "",       match: [tomcat] }
    - { eco: Maven, name: "org.springframework:spring-core",            version: "5.3.31", match: [spring] }
    - { eco: Maven, name: "org.springframework:spring-webmvc",          version: "5.3.31", match: [spring] }
    - { eco: Maven, name: "org.springframework.boot:spring-boot",       version: "",       match: [spring-boot] }
    - { eco: Maven, name: "org.springframework.security:spring-security-web", version: "",  match: [spring-security] }
    - { eco: Maven, name: "org.apache.logging.log4j:log4j-core",        version: "2.17.1", match: [log4j] }
    - { eco: Maven, name: "ch.qos.logback:logback-classic",             version: "",       match: [logback] }
    - { eco: Maven, name: "com.alibaba:fastjson",                       version: "",       match: [fastjson] }
    - { eco: Maven, name: "com.fasterxml.jackson.core:jackson-databind", version: "",      match: [jackson] }
    - { eco: Maven, name: "org.apache.shiro:shiro-core",                version: "",       match: [shiro] }
    - { eco: Maven, name: "org.apache.struts:struts2-core",             version: "",       match: [struts] }
    - { eco: Maven, name: "org.mybatis:mybatis",                        version: "",       match: [mybatis] }
    - { eco: Maven, name: "org.apache.dubbo:dubbo",                     version: "",       match: [dubbo] }
    - { eco: Maven, name: "cn.hutool:hutool-all",                       version: "",       match: [hutool] }
    - { eco: Maven, name: "com.mysql:mysql-connector-j",                version: "",       match: [mysql-connector] }

    # ---- PHP 技术栈 ----
    - { eco: Packagist, name: "laravel/framework",     version: "", match: [laravel] }
    - { eco: Packagist, name: "symfony/http-kernel",   version: "", match: [symfony] }
    - { eco: Packagist, name: "guzzlehttp/guzzle",     version: "", match: [guzzle] }
    - { eco: Packagist, name: "monolog/monolog",       version: "", match: [monolog] }
    - { eco: Packagist, name: "topthink/framework",    version: "", match: [thinkphp] }
    - { eco: Packagist, name: "phpmailer/phpmailer",   version: "", match: [phpmailer] }

    # ---- 前端 / Node ----
    - { eco: npm, name: "vue",        version: "", match: [vue.js, vue] }
    - { eco: npm, name: "vue-router", version: "", match: [vue-router] }
    - { eco: npm, name: "axios",      version: "", match: [axios] }
    - { eco: npm, name: "express",    version: "", match: [express] }
    - { eco: npm, name: "lodash",     version: "", match: [lodash] }
    - { eco: npm, name: "next",       version: "", match: [next.js] }

    # ---- Python ----
    - { eco: PyPI, name: "django",       version: "", match: [django] }
    - { eco: PyPI, name: "flask",        version: "", match: [flask] }
    - { eco: PyPI, name: "fastapi",      version: "", match: [fastapi] }
    - { eco: PyPI, name: "requests",     version: "", match: [requests] }
    - { eco: PyPI, name: "urllib3",      version: "", match: [urllib3] }
    - { eco: PyPI, name: "cryptography", version: "", match: [cryptography] }
    - { eco: PyPI, name: "sqlalchemy",   version: "", match: [sqlalchemy] }
    - { eco: PyPI, name: "psycopg2",     version: "", match: [psycopg2] }
    - { eco: PyPI, name: "redis",        version: "", match: [redis-py] }

# ---------- 3. 中间件 / 服务器的纯文本监控 ----------
# 这类东西不是语言包，OSV 覆盖不到，走 NVD 关键词 + KEV 兜底。
# 官方公告页没有 JSON 的（Tomcat、nginx）只能爬，这里用 NVD 代替，更省心。
keyword_watch:
  - tomcat
  - nginx
  - httpd
  - openssl
  - openssh
  - redis
  - elasticsearch
  - rabbitmq
  - kafka
  - zookeeper
  - jenkins
  - gitlab
  - docker
  - kubernetes
  - weblogic

# 排除词。关键词匹配的天花板就在这里：
# 比如 "Redis Lua HEAP overflow ... in Apache Kvrocks" 会因为含 redis 被误捞，
# 但你其实没用 Kvrocks。把这类串台词写进来，命中即丢弃。
keyword_exclude:
  - kvrocks
  - iotdb
  - dolphinscheduler
  - seatunnel

# ---------- 4. 外部 feed（直连，无需 key） ----------
feeds:
  cisa_kev: "https://www.cisa.gov/sites/default/files/feeds/known_exploited_vulnerabilities.json"
  epss_api: "https://api.first.org/data/v1/epss"
  github_advisories: "https://api.github.com/advisories"
  packagist_api: "https://packagist.org/api/security-advisories/"

# ---------- 5. 分级与推送策略 ----------
policy:
  min_cvss: 7.0            # 低于这个分且没被在野利用的，丢弃
  epss_threshold: 0.1      # EPSS 高于此值升级为 P1
  always_push_kev: true    # 进了 CISA KEV 无条件 P0
  always_push_cvss: 9.0    # CVSS 达到此值才具备 P0 资格（仍需在野利用证据或命中自有组件）
  # 发布超过 N 天的条目不再进日报（已进 KEV 的除外）。
  # NVD 的采集窗口按 lastModified 算，老漏洞改个措辞也会进来；OSV 也会把
  # 该组件历史上的漏洞全返回。这条统一挡住，保证日报只有"新增"。
  # 顺手留 2 天容差，避免因时区/发布延迟漏掉边界当天的条目。
  stale_days: 2
  # 分级配额：日报要在一条消息里读完，宁可少推也不能刷屏
  quota:
    P0: 5
    P1: 4
    P2: 4

# ---------- 6. 历史回填：给全景页灌基数 ----------
# 只影响 web/data.json 的内容，不影响日报推送。
# 命令：python collect.py --since 2026-01-01
backfill:
  days: 365                # --backfill N 且没给 --since 时的默认窗口
  # 全景页固定起点。改了这里，data.json 里早于它的条目会在下次写入时被清掉。
  start_date: "2026-01-01"
  min_cvss: 7.0            # 回填收录门槛，比日报宽松就调这里
  # 全景页按 CNA 全量收录（订阅了 Apache/Oracle/PHP 就算你的关注范围），
  # 不再过关键词粗筛——否则一年只剩几十条，页面没有"全景"的用处。
  # 想让全景也只显示中间件相关，改成 true。
  keyword_filter: false
  nvd_chunk_days: 100      # NVD 单次查询上限 120 天，切 100 留余量
  gh_max_pages: 20         # GitHub Advisory 每生态分页上限（6 个生态，匿名 60 次/小时够）
  max_entries: 12000       # 兜底上限：Oracle 季度批量公告可能一次灌上千条
  retention_days: 400      # 滚动保留天数（start_date 更晚时以 start_date 为准）

# ---------- 7. 网页 ----------
web:
  # 看板有两条独立链路，同一份数据、同一份页面：
  #   ① GitHub Pages  —— 本仓库 gh-pages 分支，全球可达，不依赖这台服务器
  #   ② 自有服务器   —— nginx 容器挂载 web/ 目录，域名备案后作为主站
  # 两条链路每轮采集后都会更新（见 scripts/cron-run.sh），任一挂掉另一个还能看。
  #
  # public_url 是日报里给的正式入口；backup_url 是备用入口，留空则不渲染。
  # 备案通过、域名可用之后把两者对调即可，其他地方不用改。
  public_url: "https://rayassassin.github.io/vuln-watch/"
  backup_url: ""    # 例：http://你的域名/（备案前服务器 80/8080 从公网不可达，先留空）

wecom:
  # cli      —— 走已授权的 wecom-cli 机器人（本机用）
  # app      —— 走自建应用 message/send（服务器用，不需要 wecom-cli）
  # webhook  —— 群机器人地址
  # both     —— 同时发
  # 可被环境变量 WECOM_CHANNEL 覆盖，这样两台机器共用同一份配置不用改文件
  channel: cli
  chat_id: ""               # 留空则自动取当前授权人身份发给自己
  chat_id_env: WECOM_CHAT_ID
  webhook_env: WECOM_VULN_WEBHOOK   # 仅 channel=webhook 时需要
  # 自建应用通道：凭据从环境变量或该文件读，绝不写进本文件
  # 服务器上由部署配置（VW_WECOM_APP_ENV）注入 WECOM_APP_ENV 指向凭据文件
  app_env_file: ""
  app_env_file_env: WECOM_APP_ENV
  touser: ""                # 留空则用 WX_TOUSER 环境变量，再退化为自动解析授权人
  touser_env: WX_TOUSER
  app_max_bytes: 1800       # 应用消息 markdown 硬上限 2048 字节，留余量
  # 注意区分三个限制：CLI 通道单条 20480 字节，自建应用 2048，群机器人 webhook 也是 2048
  max_bytes: 6000
